# Sample Film for slice 1: Blender Studio's open movie "Agent 327: Operation Barbershop" (2017).
# It stands in for a real Film so T2-T4 can be tested end to end on real footage.
#
# Every fact is from a published source, never guessed:
# - synopsis and characters: Gigazine (2017-05-17) and 3DVF on the short, and Martin Lodewijk's
#   Agent 327 comics, where Boris Kloris is the recurring villain
# - runtime: probed from the trailer file by the footage tool (231.5 s with credits)
# - voice cast: not listed, because no source we found says who voices whom
#
# Real Films' film.toml files are gitignored: a Spoiler List is unreleased plot.

