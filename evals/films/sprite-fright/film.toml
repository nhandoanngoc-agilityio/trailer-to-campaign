# Spoilers: from the full film (youtube _cMxraX_5RE), sampled frames and a local transcript. "The sprites turn deadly" is the premise and the hook, so it is not listed: who dies and who is
# spared are. The Showreel shows neither (it is a making-of reel), so this Film has no input Trap.
[[spoilers]]
id = "the-others-die"
text = "The sprites kill the rest of the group: at dawn they march off wearing the teenagers' belongings as trophies."
why = "The ending: the dawn procession at 8:56-9:08 (536-548 s)."

[[spoilers]]
id = "ellie-spared"
text = "Ellie is the only one spared: the Elder Sprite is about to kill her, then lets her go because of a bird."
why = "7:57-8:46: 'Now you'll join them!' (485 s), then 'I'll give you that one, brother bird!' (526 s)."
