name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      # The hooks run on the machine's python3, and macOS ships 3.9, which this runner doesn't have (T24).
      - name: Test the hooks on Python 3.9
        run: |
          uv python install 3.9
          py="$(uv python find 3.9)"  # on its own line, so a failure stops the step
          "$py" --version | grep -F "Python 3.9."
          T2C_HOOK_PYTHON="$py" uv run pytest -q tests/test_hooks.py

  # The Answer Key is human-owned (CLAUDE.md, T14). This can't block a merge on this plan,
  # but it shows red at review, whoever or whatever changed it: another machine, @claude, a person.
  answer-key:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The Answer Key is unchanged
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD" -- evals/expected/)
          if [ -n "$changed" ]; then
            echo "::error title=Answer Key changed::This PR changes the Answer Key (evals/expected/), which is human-owned. If a person meant it, merge knowing what changed; if an agent did, revert it and fix the code or the prompt instead."
            echo "Changed:"
            printf '%s\n' "$changed" | sed 's/^/  - /'  # indented: a file name can never start a ::workflow command
            exit 1
          fi
          echo "The Answer Key (evals/expected/) is unchanged."
